<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth AI 레퍼런스와 미달 구현 비교</title><style>body{margin:0;padding:25px;background:#eef2fa;color:#172747;font:14px/1.8 system-ui,'Malgun Gothic',sans-serif}h1{font-size:24px;margin:0}p{max-width:1100px}strong{color:#9a3d56}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;border:1px solid #c6d3ea;border-radius:10px;background:white;overflow:hidden}figcaption{padding:13px 16px;font-weight:600}img{display:block;width:100%}.note{padding:0 16px 16px;font-weight:400;font-size:12px}a{color:#315de0}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Depth AI 레퍼런스와 실제 EXE 비교</h1><p><strong>현재 구현은 레퍼런스 재현에 실패한 상태이며 승인된 완성 디자인이 아닙니다.</strong> 왼쪽의 분위기·재질·구성·아이콘·밀도를 실제 네이티브 화면에 구현하는 것이 다음 작업입니다. 빌드와 기능 테스트 통과를 시각적 완성으로 바꾸어 설명하지 않습니다.</p><p><a href="HANDOFF-2026-10-29.md">인수인계 기록</a> · <a href="../AGENTS.md">작업 재개 지침</a></p><div class="grid"><figure><figcaption>목표 비교 기준 — 전달했던 레퍼런스</figcaption><a href="../design/storyboards/meta-focus-20261029/02-light-focused-composition-v2.png"><img src="../design/storyboards/meta-focus-20261029/02-light-focused-composition-v2.png" alt="레퍼런스의 Meta 분위기와 정면 구성판"></a><div class="note">유리 재질, 입체 깊이, 역할별 아이콘, 읽기 쉬운 정면 구성, 아래쪽 프로젝트 탐색대.</div></figure><figure><figcaption>실제 EXE — 재현 실패 상태</figcaption><a href="screenshots/2026-10-29-native-focused.png"><img src="screenshots/2026-10-29-native-focused.png" alt="현재 EXE의 단순 평면 패널"></a><div class="note">단순 평면 패널과 함수 기호에 치우쳤고 프리뷰 간격 문제도 남았습니다. 사용자가 원한 모습과 큰 차이가 있습니다.</div></figure><figure><figcaption>과밀 지적 대상 — 최근 탐색 시안 1번</figcaption><a href="../design/storyboards/meta-focus-20261029/01-light-explore.png"><img src="../design/storyboards/meta-focus-20261029/01-light-explore.png" alt="난잡하다는 지적을 받은 탐색 시안"></a><div class="note">밀도·빛·테두리를 줄여야 합니다. 그래픽 품질과 깊이 자체를 없애라는 요청은 아닙니다.</div></figure><figure><figcaption>실제 EXE — 현재 탐색 상태</figcaption><a href="screenshots/2026-10-29-native-overview.png"><img src="screenshots/2026-10-29-native-overview.png" alt="현재 EXE의 실제 탐색 상태"></a><div class="note">아직 레퍼런스의 공간·재질 수준에 미달합니다.</div></figure></div></body></html>
